services:
  server:
    build:
      context: ./server
    container_name: mini-erp-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "5001:5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: mini-erp-client
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - server